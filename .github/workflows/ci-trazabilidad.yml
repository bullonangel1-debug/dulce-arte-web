name: CI 4 - Trazabilidad con issues

on:
  pull_request:
    branches: [ "main" ]
    types: [ opened, edited, synchronize, reopened ]

jobs:
  trazabilidad:
    name: Verificar issue y nombre de rama
    runs-on: ubuntu-latest
    steps:
      - name: Verificar que el pull request mencione un issue
        env:
          TITULO: ${{ github.event.pull_request.title }}
          DESCRIPCION: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s\n%s' "$TITULO" "$DESCRIPCION" | grep -Eq '#[0-9]+'; then
            echo "El pull request esta vinculado a un issue."
          else
            echo "::error::El pull request debe mencionar su issue (por ejemplo: Closes #7)."
            exit 1
          fi

      - name: Verificar el nombre de la rama corta
        env:
          RAMA: ${{ github.head_ref }}
        run: |
          if echo "$RAMA" | grep -Eq '^(feature|fix|hotfix)/'; then
            echo "Rama corta valida: $RAMA"
          else
            echo "::error::La rama debe empezar con feature/, fix/ o hotfix/ (rama actual: $RAMA)."
            exit 1
          fi
